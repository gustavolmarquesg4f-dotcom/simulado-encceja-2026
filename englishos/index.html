<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f6">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>EnglishOS Pro — Daniel AI</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7f6;color:#15211d}.card{width:min(460px,100%);background:#fff;border:1px solid #e4eae7;border-radius:26px;padding:34px;box-shadow:0 24px 70px rgba(24,52,43,.10);position:relative;z-index:10}.avatar{width:76px;height:76px;margin:0 auto 16px;border-radius:50%;display:grid;place-items:center;background:#176b57;font-size:28px;font-weight:900;color:#fff}.eyebrow{text-align:center;font-size:11px;letter-spacing:.12em;font-weight:900;color:#176b57}.card h1{text-align:center;margin:12px 0 8px;font-size:clamp(28px,6vw,36px);letter-spacing:-.04em}.intro{text-align:center;color:#66736e;line-height:1.55;margin:0 0 24px}.label{display:block;font-weight:800;margin-bottom:8px}.password-row{position:relative}.password-row input{display:block;width:100%;height:54px;border:1px solid #dce5e1;border-radius:14px;background:#fbfcfb;color:#15211d;padding:0 58px 0 15px;font-size:18px;outline:none;pointer-events:auto!important;user-select:text!important;-webkit-user-select:text!important;opacity:1!important}.password-row input:focus{border-color:#176b57;box-shadow:0 0 0 4px rgba(23,107,87,.10)}.show{position:absolute;right:8px;top:7px;width:42px;height:40px;border:0;border-radius:10px;background:#eef4f1;cursor:pointer;font-size:18px}.submit{width:100%;height:52px;margin-top:14px;border:0;border-radius:14px;background:#176b57;color:white;font-size:17px;font-weight:900;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}.error{min-height:24px;margin-top:10px;color:#b4233b;font-weight:800;text-align:center}.status{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;color:#66736e;font-size:14px}.dot{width:9px;height:9px;border-radius:50%;background:#d08a15}.dot.online{background:#38a482}.hint{text-align:center;margin-top:16px;color:#83908b;font-size:13px}.noscript{background:#fff0f2;color:#8f1d35;padding:12px;border-radius:10px;margin-top:14px}
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar">D</div>
    <div class="eyebrow">ENGLISHOS • DANIEL</div>
    <h1>Vamos conversar.</h1>
    <p class="intro">Sua prática de inglês começa com uma conversa curta e guiada pelo Daniel.</p>
    <form id="loginForm" autocomplete="on">
      <label class="label" for="password">Senha de acesso</label>
      <div class="password-row">
        <input id="password" name="password" type="password" inputmode="text" autocomplete="current-password" autocapitalize="none" spellcheck="false" placeholder="Digite sua senha">
        <button class="show" id="showPassword" type="button" aria-label="Mostrar senha">👁️</button>
      </div>
      <button class="submit" id="submitButton" type="submit">Entrar</button>
      <div class="error" id="error" role="alert"></div>
    </form>
    <div class="status"><span class="dot" id="dot"></span><span id="status">Verificando o Daniel...</span></div>
    <div class="hint">Senha sensível a letras maiúsculas e minúsculas.</div>
    <noscript><div class="noscript">Ative o JavaScript para entrar.</div></noscript>
  </main>
  <script>
    (()=>{
      'use strict';
      const form=document.getElementById('loginForm'),input=document.getElementById('password'),button=document.getElementById('submitButton'),error=document.getElementById('error'),status=document.getElementById('status'),dot=document.getElementById('dot'),show=document.getElementById('showPassword');let busy=false;
      if(location.hostname.endsWith('github.io')){location.replace('https://simulado-encceja-2026.vercel.app/englishos/');return;}
      input.disabled=false;input.readOnly=false;input.tabIndex=0;input.style.pointerEvents='auto';input.addEventListener('pointerdown',()=>input.focus());input.addEventListener('click',()=>input.focus());show.addEventListener('click',()=>{input.type=input.type==='password'?'text':'password';input.focus();});
      async function health(){try{const r=await fetch('/api/health',{cache:'no-store',credentials:'include'}),d=await r.json();if(d.aiConfigured&&d.authConfigured){dot.classList.add('online');status.textContent='Daniel conectado';}else status.textContent='A configuração do Daniel está incompleta.';}catch{status.textContent='Verificação indisponível. O login ainda pode funcionar.';}}
      form.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const password=input.value;if(!password){error.textContent='Digite a senha.';input.focus();return;}busy=true;error.textContent='';button.disabled=true;button.textContent='Entrando...';try{const r=await fetch('/api/auth',{method:'POST',credentials:'include',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({password})}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(r.status===401?'Senha incorreta.':(d.error||`Erro ${r.status} ao entrar.`));sessionStorage.setItem('englishos-access','granted');location.replace('./app.html?v=27');}catch(err){error.textContent=err.message||'Não foi possível entrar.';input.focus();input.select();}finally{busy=false;button.disabled=false;button.textContent='Entrar';}});
      health();setTimeout(()=>input.focus(),200);
    })();
  </script>
</body>
</html>
